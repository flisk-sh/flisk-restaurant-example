version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/bun" # pinned to "latest": there is no version to bump
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
