name: 🍽️ Restaurant Example CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdk-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: 🩺 TDK doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash
      - name: Free port 5432
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' >/dev/null 2>&1 || true
          sudo fuser -k 5432/tcp 2>/dev/null || true
      - name: Install TDK
        run: npm install --global @tdk-landscape/tdk-cli-core@latest
      - name: Generate project configuration
        run: tdk project --yes
      - name: Run tdk doctor
        run: tdk doctor --no-ping

  e2e:
    name: 🍽️ TDK end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install example dependencies
        run: bun install --frozen-lockfile
      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash
      - name: Free port 5432
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' >/dev/null 2>&1 || true
          sudo fuser -k 5432/tcp 2>/dev/null || true
      - name: Install TDK
        run: npm install --global @tdk-landscape/tdk-cli-core@latest
      - name: Generate project configuration
        run: tdk project --yes
      - name: Start the example and verify real app routes
        shell: bash
        env:
          API_CHECKS: |
            reservation|/api/v1/reservations
            reservation|/api/v1/waitlist
            kitchen|/api/v1/tickets
            kitchen|/api/v1/stations
            menu|/api/v1/menu-items
          WEB_CHECKS: |
            reservation-app|/
            floor-app|/
        run: |
          tdk up > up.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tdk down >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 90); do
            grep -q 'Running tilt up' up.log && break
            if ! kill -0 "$pid" 2>/dev/null; then cat up.log; exit 1; fi
            sleep 2
          done
          if ! grep -q 'Running tilt up' up.log; then
            tail -100 up.log
            echo 'tdk up did not start Tilt in 3 minutes' >&2
            exit 1
          fi
          awk '/Starting [0-9]+ service/{found=1} /Running tilt up/{found=0} found' up.log \
            | grep -oE 'https?://[^ ]+' | sort -u > urls.txt || true
          grep -E '^https?://api\.' urls.txt > backend-urls.txt || true
          grep -E '^https?://app\.' urls.txt > web-urls.txt || true
          if [ ! -s backend-urls.txt ]; then
            tail -100 up.log
            echo 'tdk up did not report backend health URLs' >&2
            exit 1
          fi
          total=$(wc -l < backend-urls.txt | tr -d ' ')
          for attempt in $(seq 1 72); do
            healthy=$(xargs -P 12 -I{} curl -s -o /dev/null -m 5 -w '%{http_code}\n' {} < backend-urls.txt | grep -c '^2' || true)
            echo "Healthy backends: $healthy/$total"
            [ "$healthy" -eq "$total" ] && break
            tilt get uiresources -o json 2>/dev/null | jq -e '[.items[] | select(.status.updateStatus == "error")] | length > 0' >/dev/null && {
              echo 'Tilt reported a failed resource:' >&2
              tilt get uiresources -o json | jq -c '.items[] | select(.status.updateStatus == "error") | {name: .metadata.name, status: .status}'
              for resource in $(tilt get uiresources -o json | jq -r '.items[] | select(.status.updateStatus == "error") | .metadata.name'); do
                echo "::group::Build log for $resource"
                tilt logs --source build --since 20m "$resource" || true
                echo "::endgroup::"
              done
              exit 1
            }
            sleep 15
          done
          [ "$healthy" -eq "$total" ] || {
            echo "Only $healthy of $total backends became healthy within 18 minutes" >&2
            tail -100 up.log
            exit 1
          }

          if [ -n "$WEB_CHECKS" ]; then
            frontend_total=$(wc -l < web-urls.txt | tr -d ' ')
            [ "$frontend_total" -gt 0 ] || { echo 'No frontend health URLs were reported' >&2; exit 1; }
            for attempt in $(seq 1 72); do
              frontend_healthy=$(xargs -P 8 -I{} curl -s -o /dev/null -m 5 -w '%{http_code}\n' {} < web-urls.txt | grep -c '^2' || true)
              echo "Healthy frontends: $frontend_healthy/$frontend_total"
              [ "$frontend_healthy" -eq "$frontend_total" ] && break
              tilt get uiresources -o json 2>/dev/null | jq -e '[.items[] | select(.status.updateStatus == "error")] | length > 0' >/dev/null && {
                echo 'Tilt reported a failed resource while waiting for frontends:' >&2
                tilt get uiresources -o json | jq -c '.items[] | select(.status.updateStatus == "error") | {name: .metadata.name, status: .status}'
              for resource in $(tilt get uiresources -o json | jq -r '.items[] | select(.status.updateStatus == "error") | .metadata.name'); do
                echo "::group::Build log for $resource"
                tilt logs --source build --since 20m "$resource" || true
                echo "::endgroup::"
              done
                exit 1
              }
              sleep 15
            done
            [ "$frontend_healthy" -eq "$frontend_total" ] || { echo "Only $frontend_healthy of $frontend_total frontends became healthy" >&2; exit 1; }
          fi

          # Exercise representative business APIs; /health alone can pass even
          # when app routes or generated Traefik routing are broken.
          while IFS='|' read -r pattern path; do
            [ -n "$pattern" ] || continue
            base="$(grep -E "$pattern" backend-urls.txt | head -1 | sed 's#/health$##' || true)"
            [ -n "$base" ] || { echo "No backend URL matched '$pattern'" >&2; exit 1; }
            url="$base$path"
            passed=false
            for _ in $(seq 1 12); do
              code="$(curl -sS -o response.json -m 10 -w '%{http_code}' "$url" || true)"
              if [[ "$code" == 2* ]] && jq -e . response.json >/dev/null 2>&1; then
                echo "API OK $url"
                passed=true
                break
              fi
              sleep 5
            done
            if [ "$passed" != true ]; then
              echo "API check failed: $url (HTTP ${code:-none})" >&2
              cat response.json 2>/dev/null || true
              exit 1
            fi
          done <<< "$API_CHECKS"

          # Check each app route returns its actual HTML page, not only a
          # container health response.
          while IFS='|' read -r pattern path; do
            [ -n "$pattern" ] || continue
            base="$(grep -E "$pattern" web-urls.txt | head -1 | sed -E 's#/health$##; s#/+$##' || true)"
            [ -n "$base" ] || { echo "No frontend URL matched '$pattern'" >&2; exit 1; }
            url="$base$path"
            passed=false
            for _ in $(seq 1 12); do
              code="$(curl -sS -o page.html -m 10 -w '%{http_code}' "$url" || true)"
              if [[ "$code" == 2* ]] && grep -qi '<html' page.html; then
                echo "Page OK $url"
                passed=true
                break
              fi
              sleep 5
            done
            if [ "$passed" != true ]; then
              echo "Frontend check failed: $url (HTTP ${code:-none})" >&2
              head -c 500 page.html 2>/dev/null || true
              exit 1
            fi
          done <<< "$WEB_CHECKS"
      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: |
          tail -200 up.log 2>/dev/null || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          tilt get uiresources -o json 2>/dev/null | jq -r '.items[] | select(.status.updateStatus == "error") | .metadata.name' || true
