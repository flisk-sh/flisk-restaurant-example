    restart: unless-stopped
    build:
      context: ../../../../.
      dockerfile: services/operations/menu-api/.autogenerated/Dockerfile.app.autogenerated

    env_file:
      - ../../../services/operations/menu-api/.autogenerated/.env.backend.autogenerated
    environment:
