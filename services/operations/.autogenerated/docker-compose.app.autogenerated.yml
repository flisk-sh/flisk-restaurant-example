      - INFISICAL_API_URL=${INFISICAL_API_URL:-http://infisical:8080}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID:-}
      - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT:-dev}
      - INFISICAL_ALLOW_FALLBACK=${INFISICAL_ALLOW_FALLBACK:-true}
      - RESOURCE_NAME=operations
      - PORT=4120
      - INSTANCE_ID=0
      - NATS_QUEUE_GROUP=operations_backend_svc
      - TILT_DATABASE_URL=postgresql://flisk_restaurant_example:${DB_PASSWORD}@flisk_restaurant_example_postgres:5432/flisk_restaurant_example_operations?schema=public
      - TILT_NATS_URL=nats://flisk_restaurant_example_nats:4222
      - NODE_ENV=development
      - DATABASE_URL=postgresql://flisk_restaurant_example:${DB_PASSWORD}@flisk_restaurant_example_postgres:5432/flisk_restaurant_example_operations?schema=public
